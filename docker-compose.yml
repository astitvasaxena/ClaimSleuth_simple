# One-VM production stack: ONE application image (Dockerfile.single: dashboard + ADK + MCP + CrewAI service, started by the
# dashboard itself) behind Caddy. SQLite (WAL) blackboard => everything shares ONE machine and the `runtime` volume.
# Only Caddy publishes ports (80/443). Chosen over the two-image stack because measured memory is the same and it needs
# one image (about 0.9 GB less disk, one container less to supervise on a 2 GB VM); see docs/submission/results/deploy_test.md.
# Run from the repo root:  docker compose --env-file deploy/.env up -d --build
x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}

services:
  app:
    build: {context: ., dockerfile: Dockerfile.single}
    image: claimsleuth-single:latest
    restart: unless-stopped
    environment:
      EXECUTION_MODE: ${MODE:-offline}          # offline (default) | live
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}       # only needed for MODE=live; comes from deploy/.env on the VM
      CLAIMSLEUTH_BLACKBOARD_DB: /app/runtime/blackboard.sqlite3
    volumes: [runtime:/app/runtime]
    expose: ["7860"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:7860/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports: ["80:80", "443:443"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-claimsleuth}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH:?set BASIC_AUTH_HASH in deploy/.env (see docs/DEPLOYMENT_GUIDE.md)}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *logging

volumes:
  runtime:
  caddy_data:
  caddy_config:
