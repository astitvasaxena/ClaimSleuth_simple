name: CI
# Fast gate on every PR and every push to main. The full pytest suites take about 45 minutes and start real services,
# so they are run by hand (workflow_dispatch) or locally. The VM deploys whatever lands on main (deploy/auto_update.sh),
# so merge only green PRs.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_tests: {description: "Also run the main pytest suite (about 35 min)", type: boolean, default: false}
permissions: {contents: read}
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Python compiles
        run: python -m compileall -q src tests
      - name: Shell scripts parse
        run: for f in deploy/*.sh deploy/aws/*.sh deploy/gcp/*.sh; do bash -n "$f"; done
      - name: No secrets committed
        run: |
          ! git ls-files | grep -E '(^|/)\.env$|\.pem$|\.tgz$'
          ! git grep -nE 'AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{35}' -- . ':!tests'
      - name: Production image builds
        run: docker build -f Dockerfile.single -t claimsleuth-single:ci .
      - name: Full main suite (manual only)
        if: ${{ github.event.inputs.full_tests == 'true' }}
        run: |
          python -m pip install -r requirements/main.txt && python -m pip install -e .
          python -m venv .venv-crew && .venv-crew/bin/pip install -r requirements/crew.txt && .venv-crew/bin/pip install -e .
          python -m pytest tests --ignore=tests/crew -q
